<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Private Vault</title><style>body{font-family:Arial;background:#fef6ff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:white;padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1);width:90%;max-width:500px}input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;background:#a855f7;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold}#vault{display:none}.msg{border-bottom:1px solid #eee;padding:12px 0}</style></head><body><div class="card"><div id="login"><h2>🔒 Private Vault</h2><input type="password" id="pass" placeholder="Enter vault password"><button onclick="unlock()">Unlock the vault</button><p id="err" style="color:red"></p><a href="/">Back</a></div><div id="vault"><h2>💌 Secret Messages</h2><div id="list"></div><button onclick="location.reload()" style="margin-top:20px;background:#eee;color:#333">Lock Vault</button></div></div><script>async function unlock(){const token=document.getElementById('pass').value;const err=document.getElementById('err');err.textContent='Loading...';try{const res=await fetch('/api/admin/messages',{headers:{'x-admin-token':token}});if(!res.ok){const d=await res.json();throw new Error(d.error||'Wrong password');}const messages=await res.json();document.getElementById('login').style.display='none';document.getElementById('vault').style.display='block';const list=document.getElementById('list');if(messages.length===0){list.innerHTML='<p>No messages yet</p>';return;}list.innerHTML=messages.map(m=>`<div class=msg><b>${m.senderName} → ${m.recipientName}</b><br>${m.message}<br><small style=color:#999>${new Date(m.createdAt).toLocaleString()}</small></div>`).join('');}catch(e){err.textContent=e.message;}}</script></body></html>
